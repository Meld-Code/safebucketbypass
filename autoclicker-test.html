<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Clicker Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --panel: #1b1b1b;
      --border: #3c3c3c;
      --text: #f2f2f2;
      --muted: #999;
      --green: #65e88a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #292929, var(--bg) 70%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(460px, calc(100% - 30px));
      padding: 28px;
      text-align: center;
      background: linear-gradient(145deg, #242424, #141414);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 25px 70px #000b;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }

    #clickTarget {
      width: 220px;
      height: 130px;
      margin: 0 auto 24px;
      border: 2px solid #777;
      border-radius: 18px;
      background: #292929;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }

    #clickTarget:hover {
      background: #333;
      border-color: white;
    }

    #clickTarget:active,
    #clickTarget.flash {
      transform: scale(.94);
      background: #315d3d;
      border-color: var(--green);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 14px;
      border: 1px solid #303030;
      border-radius: 13px;
      background: #151515;
    }

    .stat span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat strong {
      font-size: 20px;
    }

    #resetButton {
      padding: 11px 18px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #eee;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    #resetButton:hover {
      background: white;
    }

    #status {
      min-height: 18px;
      margin-top: 16px;
      color: var(--green);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Auto Clicker Test</h1>
    <p>Focus this page, then start your auto clicker from the Safe Bucket control panel.</p>
<button id="clickTarget" type="button">
  CLICK TARGET
</button>

<div class="stats">
  <div class="stat">
    <span>Total Clicks</span>
    <strong id="clickCount">0</strong>
  </div>

  <div class="stat">
    <span>Clicks Per Second</span>
    <strong id="clicksPerSecond">0</strong>
  </div>
</div>

<button id="resetButton" type="button">
  Reset Test
</button>

<div id="status">Waiting for clicks...</div>

  </main>
  <script>
    const clickTarget = document.getElementById("clickTarget");
    const clickCountDisplay = document.getElementById("clickCount");
    const clicksPerSecondDisplay = document.getElementById("clicksPerSecond");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");

    let clickCount = 0;
    let clickTimes = [];

    clickTarget.addEventListener("click", () => {
      const now = Date.now();

      clickCount++;
      clickTimes.push(now);

      clickTimes = clickTimes.filter(time => now - time <= 1000);

      clickCountDisplay.textContent = clickCount;
      clicksPerSecondDisplay.textContent = clickTimes.length;
      status.textContent = `Last click: ${new Date().toLocaleTimeString()}`;

      clickTarget.classList.remove("flash");
      void clickTarget.offsetWidth;
      clickTarget.classList.add("flash");

      setTimeout(() => {
        clickTarget.classList.remove("flash");
      }, 100);
    });

    resetButton.addEventListener("click", () => {
      clickCount = 0;
      clickTimes = [];

      clickCountDisplay.textContent = "0";
      clicksPerSecondDisplay.textContent = "0";
      status.textContent = "Waiting for clicks...";
    });

    setInterval(() => {
      const now = Date.now();

      clickTimes = clickTimes.filter(time => now - time <= 1000);
      clicksPerSecondDisplay.textContent = clickTimes.length;
    }, 200);
  </script>
</body>
</html>
