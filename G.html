<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111214;
    color: white;
    font-family: Arial, sans-serif;
}

/* BACK BUTTON */
.navbar {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    background: #191a1e;
    border-bottom: 1px solid #292a30;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px;
    background: #25262b;
    color: white;
    border: 1px solid #35363d;
    border-radius: 8px;
    font-size: 15px;
    text-decoration: none;
    transition: background 0.2s;
}

.back-button:hover {
    background: #383940;
}

/* VIDEO BANNER */
.video-banner {
    position: relative;
    width: 100%;
    height: 440px;
    background: #111214;
    overflow: hidden;
}

.banner-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1s ease;
}

.banner-video.active {
    opacity: 1;
}

/* DARK SHADOW AT BOTTOM */
.banner-shadow {
    position: absolute;
    z-index: 2;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 170px;
    background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(17, 18, 20, 0.45) 45%,
        #111214 100%
    );
    pointer-events: none;
}

/* OPTIONAL BANNER TEXT */
.banner-content {
    position: absolute;
    z-index: 3;
    left: 6%;
    bottom: 48px;
}

.banner-content h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.banner-content p {
    color: #d0d0d0;
    font-size: 15px;
}

@media (max-width: 600px) {
    .navbar {
        height: 58px;
        padding: 0 15px;
    }

    .video-banner {
        height: 280px;
    }

    .banner-shadow {
        height: 110px;
    }

    .banner-content {
        left: 20px;
        bottom: 30px;
    }

    .banner-content h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<nav class="navbar">
    <a href="https://example.com" class="back-button">
        <span aria-hidden="true">←</span>
        Back
    </a>
</nav>

<!-- VIDEO HEADER BANNER -->
<header class="video-banner" id="videoBanner">

    <video class="banner-video active"
           autoplay muted playsinline preload="auto"></video>

    <video class="banner-video"
           autoplay muted playsinline preload="auto"></video>

    <div class="banner-shadow"></div>

    <div class="banner-content">
        <h1>Featured Games</h1>
        <p>Discover something new to play.</p>
    </div>

</header>

<script>
/* REPLACE THESE WITH YOUR VIDEO FILE PATHS */
const videoUrls = [
    "RobloxPage.mp4",
    "",
    "RobloxPage.mp4"
];

const videos = Array.from(
    document.querySelectorAll(".banner-video")
);

let playlistIndex = 0;
let activeElement = 0;
let switchTimer = null;
let switching = false;

/* Random interval between 8 and 16 seconds */
function randomDelay() {
    return Math.floor(Math.random() * 8000) + 8000;
}

function scheduleNext() {
    clearTimeout(switchTimer);

    switchTimer = setTimeout(() => {
        switchVideo();
    }, randomDelay());
}

function switchVideo() {
    if (switching || videoUrls.length < 2) return;

    switching = true;

    const nextElement = 1 - activeElement;
    const nextVideo = videos[nextElement];

    playlistIndex = (playlistIndex + 1) % videoUrls.length;

    nextVideo.src = videoUrls[playlistIndex];
    nextVideo.load();
    nextVideo.muted = true;

    nextVideo.play().then(() => {
        nextVideo.classList.add("active");
        videos[activeElement].classList.remove("active");

        const previousElement = activeElement;
        activeElement = nextElement;

        // Let the fade finish before stopping the previous video.
        setTimeout(() => {
            videos[previousElement].pause();
            switching = false;
            scheduleNext();
        }, 1100);

    }).catch(() => {
        switching = false;
        scheduleNext();
    });
}

/* Start the first video automatically */
videos[0].src = videoUrls[0];
videos[0].muted = true;
videos[0].load();

videos[0].play().then(() => {
    scheduleNext();
}).catch(() => {
    // Autoplay can be blocked by browser or device settings.
    // Muted autoplay is supported by most modern browsers.
});

/* If the active video fails, try the next one */
videos.forEach(video => {
    video.addEventListener("error", () => {
        if (video.classList.contains("active")) {
            clearTimeout(switchTimer);
            switchTimer = setTimeout(switchVideo, 1000);
        }
    });
});
</script>

</body>
</html>
