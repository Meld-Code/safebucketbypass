<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Discover featured games on Game Hub."
    >

    <title>Game Hub</title>

    <style>
        :root {
            --background: #111214;
            --navbar: #191a1e;
            --card: #1d1f24;
            --card-hover: #282b32;
            --border: #30323a;
            --text: #ffffff;
            --muted: #b9bbc2;
            --accent: #6c7cff;
            --accent-hover: #8491ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        button,
        input,
        a {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 20;
            min-height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            background: rgba(25, 26, 30, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 15px;
            background: #25262b;
            color: var(--text);
            border: 1px solid #3a3c45;
            border-radius: 9px;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .back-button:hover {
            background: #383940;
            border-color: #555968;
            transform: translateY(-2px);
        }

        .back-button:focus-visible,
        .primary-button:focus-visible,
        .secondary-button:focus-visible,
        .banner-control:focus-visible,
        .banner-dot:focus-visible,
        .game-card:focus-visible,
        .favorite-button:focus-visible,
        #gameSearch:focus-visible {
            outline: 3px solid var(--accent-hover);
            outline-offset: 3px;
        }

        .video-banner {
            position: relative;
            min-height: 470px;
            height: min(58vw, 560px);
            overflow: hidden;
            isolation: isolate;
            background: #0b0c0e;
        }

        .banner-video,
        .banner-fallback {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-video {
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .banner-video.active {
            opacity: 1;
        }

        .banner-fallback {
            z-index: -1;
            background:
                linear-gradient(
                    135deg,
                    rgba(108, 124, 255, 0.35),
                    rgba(17, 18, 20, 0.95)
                ),
                url("images/game-fallback.jpg") center / cover;
        }

        .banner-overlay {
            position: absolute;
            z-index: 1;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.82) 0%,
                    rgba(0, 0, 0, 0.45) 45%,
                    rgba(0, 0, 0, 0.12) 100%
                ),
                linear-gradient(
                    0deg,
                    rgba(17, 18, 20, 1) 0%,
                    transparent 35%
                );
            pointer-events: none;
        }

        .banner-content {
            position: absolute;
            z-index: 3;
            right: 24px;
            bottom: 94px;
            left: 7%;
            max-width: 570px;
            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .banner-kicker {
            margin-bottom: 8px;
            color: var(--accent-hover);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .banner-content h1 {
            margin-bottom: 12px;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1.05;
        }

        .banner-content p {
            max-width: 500px;
            color: #dedfe4;
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
        }

        .banner-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .primary-button,
        .secondary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 17px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .primary-button {
            background: var(--accent);
            color: white;
            border: 0;
        }

        .primary-button:hover {
            background: var(--accent-hover);
            box-shadow: 0 8px 20px rgba(108, 124, 255, 0.3);
            transform: translateY(-2px);
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }

        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.55);
            transform: translateY(-2px);
        }

        .banner-controls {
            position: absolute;
            z-index: 5;
            right: 24px;
            bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .banner-control {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            color: white;
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .banner-control:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .banner-dots {
            position: absolute;
            z-index: 5;
            bottom: 37px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 9px;
            transform: translateX(-50%);
        }

        .banner-dot {
            width: 10px;
            height: 10px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition:
                width 0.3s ease,
                background 0.3s ease;
        }

        .banner-dot:hover {
            background: white;
        }

        .banner-dot.active {
            width: 31px;
            background: white;
        }

        .games-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .section-heading h2 {
            font-size: clamp(1.6rem, 3vw, 2.3rem);
        }

        .section-heading p {
            color: var(--muted);
        }

        .game-tools {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .game-search-wrapper {
            position: relative;
            width: min(100%, 390px);
        }

        .game-search-icon {
            position: absolute;
            top: 50%;
            left: 17px;
            color: var(--muted);
            font-size: 1.2rem;
            pointer-events: none;
            transform: translateY(-50%);
        }

        #gameSearch {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border: 1px solid var(--border);
            border-radius: 999px;
            outline: none;
            background: #17181c;
            color: var(--text);
            font-size: 1rem;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        #gameSearch::placeholder {
            color: #858892;
        }

        #gameSearch:focus {
            border-color: var(--accent);
            background: #202229;
            box-shadow: 0 0 0 4px rgba(108, 124, 255, 0.18);
        }

        .game-count {
            min-height: 22px;
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px;
        }

        .game-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 205px;
            overflow: hidden;
            padding: 0;
            background:
                linear-gradient(
                    145deg,
                    rgba(108, 124, 255, 0.14),
                    rgba(29, 31, 36, 0.98)
                );
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                border-radius 0.3s ease,
                box-shadow 0.3s ease;
        }

        .game-card::after {
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            border-radius: inherit;
            content: "";
            pointer-events: none;
            transition: border-color 0.3s ease;
        }

        .game-card:hover {
            z-index: 2;
            background:
                linear-gradient(
                    145deg,
                    rgba(108, 124, 255, 0.34),
                    rgba(40, 43, 50, 0.98)
                );
            border-color: var(--accent-hover);
            border-radius: 24px;
            box-shadow:
                0 18px 34px rgba(0, 0, 0, 0.42),
                0 0 22px rgba(108, 124, 255, 0.25);
            transform: scale(1.08);
        }

        .game-card:hover::after {
            border-color: rgba(132, 145, 255, 0.58);
        }

        .game-card:active {
            transform: scale(1.03);
        }

        .game-card img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #292b32;
            transition: transform 0.35s ease;
        }

        .game-card:hover img {
            transform: scale(1.12);
        }

        .game-card-content {
            flex: 1;
            padding: 12px;
            background: rgba(17, 18, 20, 0.32);
        }

        .game-card h3 {
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .game-card p {
            color: var(--muted);
            font-size: 0.82rem;
        }

        .favorite-button {
            position: absolute;
            z-index: 3;
            top: 9px;
            right: 9px;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .favorite-button:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .favorite-button.active {
            background: var(--accent);
            color: white;
        }

        .empty-message {
            grid-column: 1 / -1;
            padding: 50px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            color: var(--muted);
            text-align: center;
        }

        /* Game iframe page */

        .game-frame-page {
            display: none;
            min-height: calc(100vh - 64px);
            padding: 20px 24px 30px;
        }

        .game-frame-page.active {
            display: block;
        }

        .game-frame-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }

        .game-frame-heading h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
        }

        .game-frame-wrapper {
            width: 100%;
            height: calc(100vh - 155px);
            min-height: 500px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #000;
        }

        .game-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        @media (max-width: 1100px) {
            .game-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 850px) {
            .game-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 800px) {
            .video-banner {
                min-height: 430px;
                height: 72vw;
            }

            .banner-content {
                bottom: 96px;
                left: 24px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                min-height: 58px;
                padding: 0 15px;
            }

            .video-banner {
                min-height: 500px;
                height: 135vw;
            }

            .banner-content {
                right: 20px;
                bottom: 108px;
                left: 20px;
            }

            .banner-content h1 {
                font-size: 2.15rem;
            }

            .banner-controls {
                right: 20px;
                bottom: 20px;
            }

            .banner-dots {
                bottom: 35px;
            }

            .games-section {
                padding: 42px 15px 60px;
            }

            .section-heading {
                display: block;
            }

            .section-heading p {
                margin-top: 5px;
            }

            .game-tools {
                justify-content: stretch;
                margin-top: 22px;
            }

            .game-search-wrapper {
                width: 100%;
            }

            .game-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 13px;
            }

            .game-card {
                min-height: 185px;
            }

            .game-card:hover {
                transform: scale(1.04);
            }

            .game-frame-page {
                min-height: calc(100vh - 58px);
                padding: 15px;
            }

            .game-frame-heading {
                display: block;
            }

            .game-frame-heading .back-button {
                margin-top: 12px;
            }

            .game-frame-wrapper {
                height: calc(100vh - 145px);
                min-height: 400px;
            }
        }

        @media (max-width: 390px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar" aria-label="Main navigation">
        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            <span aria-hidden="true">←</span>
            Back
        </button>
    </nav>

    <main>
        <div id="homePage">
            <header
                class="video-banner"
                id="videoBanner"
                aria-roledescription="carousel"
                aria-label="Featured games"
            >
                <div
                    class="banner-fallback"
                    aria-hidden="true"
                ></div>

                <video
                    class="banner-video active"
                    id="videoOne"
                    autoplay
                    muted
                    playsinline
                    preload="metadata"
                    aria-hidden="true"
                ></video>

                <video
                    class="banner-video"
                    id="videoTwo"
                    muted
                    playsinline
                    preload="metadata"
                    aria-hidden="true"
                ></video>

                <div class="banner-overlay"></div>

                <div
                    class="banner-content"
                    id="bannerContent"
                    aria-live="polite"
                >
                    <div class="banner-kicker">
                        Featured game
                    </div>

                    <h1 id="bannerTitle">
                        Featured Games
                    </h1>

                    <p id="bannerDescription">
                        Discover something new to play.
                    </p>

                    <div class="banner-actions">
                        <button
                            class="primary-button"
                            id="playButton"
                            type="button"
                        >
                            View Game
                        </button>

                        <button
                            class="secondary-button"
                            id="browseButton"
                            type="button"
                        >
                            Browse Games
                        </button>
                    </div>
                </div>

                <div
                    class="banner-dots"
                    id="bannerDots"
                    role="tablist"
                    aria-label="Choose featured game"
                ></div>

                <div class="banner-controls">
                    <button
                        class="banner-control"
                        id="pauseButton"
                        type="button"
                        aria-label="Pause slideshow"
                        aria-pressed="false"
                    >
                        ❚❚
                    </button>

                    <button
                        class="banner-control"
                        id="previousButton"
                        type="button"
                        aria-label="Previous slide"
                    >
                        ‹
                    </button>

                    <button
                        class="banner-control"
                        id="nextButton"
                        type="button"
                        aria-label="Next slide"
                    >
                        ›
                    </button>
                </div>
            </header>

            <section
                class="games-section"
                id="games"
                aria-labelledby="gamesTitle"
            >
                <div class="section-heading">
                    <div>
                        <h2 id="gamesTitle">
                            Popular Games
                        </h2>

                        <p>
                            Choose something fun to play.
                        </p>
                    </div>
                </div>

                <div class="game-tools">
                    <div class="game-search-wrapper">
                        <span
                            class="game-search-icon"
                            aria-hidden="true"
                        >
                            ⌕
                        </span>

                        <input
                            type="search"
                            id="gameSearch"
                            placeholder="Search games..."
                            aria-label="Search games"
                            autocomplete="off"
                        >
                    </div>
                </div>

                <p
                    class="game-count"
                    id="gameCount"
                    aria-live="polite"
                ></p>

                <div
                    class="game-grid"
                    id="gameGrid"
                ></div>
            </section>
        </div>

        <section
            class="game-frame-page"
            id="gameFramePage"
            aria-labelledby="frameGameTitle"
        >
            <div class="game-frame-heading">
                <h1 id="frameGameTitle">
                    Game
                </h1>

                <button
                    class="back-button"
                    id="frameBackButton"
                    type="button"
                >
                    ← Back to games
                </button>
            </div>

            <div class="game-frame-wrapper">
                <iframe
                    class="game-frame"
                    id="gameFrame"
                    title="Game"
                    allowfullscreen
                    loading="lazy"
                ></iframe>
            </div>
        </section>
    </main>

            document.querySelector("#bannerDots");

        const pauseButton =
            document.querySelector("#pauseButton");

        const previousButton =
            document.querySelector("#previousButton");

        const nextButton =
            document.querySelector("#nextButton");

        const backButton =
            document.querySelector("#backButton");

        const frameBackButton =
            document.querySelector("#frameBackButton");

        const frameGameTitle =
            document.querySelector("#frameGameTitle");

        const gameFrame =
            document.querySelector("#gameFrame");

        const reducedMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

        let currentSlide = 0;
        let activeVideo = 0;
        let switchTimer = null;
        let isPaused = reducedMotion;
        let isSwitching = false;

        function createDots() {
            dotsContainer.innerHTML = "";

            slides.forEach((slide, index) => {
                const dot =
                    document.createElement("button");

                dot.className = "banner-dot";
                dot.type = "button";
                dot.setAttribute("role", "tab");
                dot.setAttribute(
                    "aria-label",
                    `Show ${slide.title} slide`
                );

                dot.addEventListener(
                    "click",
                    () => {
                        showSlide(index);
                    }
                );

                dotsContainer.appendChild(dot);
            });
        }

        function createGameCards(searchText = "") {
            gameGrid.innerHTML = "";

            const searchValue =
                searchText.trim().toLowerCase();

            const filteredGames =
                games.filter(game => {
                    const searchableText =
                        `${game.name} ${game.description}`
                            .toLowerCase();

                    return searchableText.includes(
                        searchValue
                    );
                });

            gameCount.textContent =
                `${filteredGames.length} game${
                    filteredGames.length === 1
                        ? ""
                        : "s"
                } found`;

            if (filteredGames.length === 0) {
                gameGrid.innerHTML = `
                    <p class="empty-message">
                        No games match your search.
                    </p>
                `;

                return;
            }

            filteredGames.forEach(game => {
                const card =
                    document.createElement("button");

                card.className = "game-card";
                card.type = "button";
                card.setAttribute(
                    "aria-label",
                    `Play ${game.name}`
                );

                card.innerHTML = `
                    <img
                        src="${game.image}"
                        alt="${game.name} cover image"
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >

                    <div class="game-card-content">
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                    </div>
                `;

                card.addEventListener(
                    "click",
                    () => {
                        openGame(game);
                    }
                );

                gameGrid.appendChild(card);
            });
        }

        function updateText(index) {
            bannerContent.style.opacity = "0";
            bannerContent.style.transform =
                "translateY(10px)";

            setTimeout(() => {
                bannerTitle.textContent =
                    slides[index].title;

                bannerDescription.textContent =
                    slides[index].description;

                playButton.textContent =
                    `Play ${slides[index].title}`;

                bannerContent.style.opacity = "1";
                bannerContent.style.transform =
                    "translateY(0)";
            }, reducedMotion ? 0 : 220);
        }

        function updateDots(index) {
            const dots =
                dotsContainer.querySelectorAll(
                    ".banner-dot"
                );

            dots.forEach((dot, dotIndex) => {
                const isActive =
                    dotIndex === index;

                dot.classList.toggle(
                    "active",
                    isActive
                );

                dot.setAttribute(
                    "aria-selected",
                    String(isActive)
                );

                dot.tabIndex =
                    isActive ? 0 : -1;
            });
        }

        function updatePauseButton() {
            pauseButton.textContent =
                isPaused ? "▶" : "❚❚";

            pauseButton.setAttribute(
                "aria-label",
                isPaused
                    ? "Play slideshow"
                    : "Pause slideshow"
            );

            pauseButton.setAttribute(
                "aria-pressed",
                String(isPaused)
            );
        }

        function scheduleNextSlide() {
            clearTimeout(switchTimer);

            if (
                !isPaused &&
                slides.length > 1 &&
                homePage.style.display !== "none"
            ) {
                switchTimer = setTimeout(() => {
                    const nextSlide =
                        (currentSlide + 1) %
                        slides.length;

                    showSlide(nextSlide);
                }, 7000);
            }
        }

        function getNextIndex(direction) {
            return (
                (
                    currentSlide +
                    direction +
                    slides.length
                ) %
                slides.length
            );
        }

        function showSlide(index) {
            if (
                slides.length === 0 ||
                slides.length === 1 ||
                index === currentSlide ||
                isSwitching
            ) {
                return;
            }

            isSwitching = true;
            clearTimeout(switchTimer);

            const nextVideoIndex =
                1 - activeVideo;

            const nextVideo =
                videos[nextVideoIndex];

            const previousVideo =
                videos[activeVideo];

            nextVideo.classList.remove("active");
            nextVideo.src =
                slides[index].video;

            nextVideo.load();

            const finishSwitch = () => {
                nextVideo.classList.add("active");
                previousVideo.classList.remove(
                    "active"
                );

                updateText(index);
                updateDots(index);

                const oldVideoIndex =
                    activeVideo;

                activeVideo =
                    nextVideoIndex;

                currentSlide = index;

                setTimeout(() => {
                    videos[oldVideoIndex].pause();

                    videos[oldVideoIndex]
                        .removeAttribute("src");

                    videos[oldVideoIndex].load();

                    isSwitching = false;
                    scheduleNextSlide();
                }, reducedMotion ? 0 : 850);
            };

            nextVideo
                .play()
                .then(finishSwitch)
                .catch(finishSwitch);
        }

        function startSlideshow() {
            if (slides.length === 0) {
                bannerTitle.textContent =
                    "No featured games";

                bannerDescription.textContent =
                    "Add videos to display featured games.";

                return;
            }

            updateText(0);
            updateDots(0);
            updatePauseButton();

            videos[0].src =
                slides[0].video;

            videos[0].load();

            videos[0].play().catch(() => {
                isPaused = true;
                updatePauseButton();
            });

            scheduleNextSlide();
        }

        function togglePause() {
            isPaused = !isPaused;

            if (isPaused) {
                clearTimeout(switchTimer);
                videos[activeVideo].pause();
            } else {
                videos[activeVideo]
                    .play()
                    .catch(() => {});

                scheduleNextSlide();
            }

            updatePauseButton();
        }

        function openGame(game) {
            clearTimeout(switchTimer);

            videos.forEach(video => {
                video.pause();
            });

            homePage.style.display = "none";
            gameFramePage.classList.add("active");

            frameGameTitle.textContent =
                game.name;

            gameFrame.title =
                `${game.name} game`;

            gameFrame.src =
                game.url;

            document.title =
                `${game.name} - Playing`;

            window.scrollTo(0, 0);
        }

        function returnHome() {
            gameFramePage.classList.remove("active");
            homePage.style.display = "block";

            gameFrame.src = "";

            document.title = "Game Hub";

            startSlideshow();
            window.scrollTo(0, 0);
        }

        gameSearch.addEventListener(
            "input",
            event => {
                createGameCards(event.target.value);
            }
        );

        pauseButton.addEventListener(
            "click",
            togglePause
        );

        previousButton.addEventListener(
            "click",
            () => {
                showSlide(getNextIndex(-1));
            }
        );

        nextButton.addEventListener(
            "click",
            () => {
                showSlide(getNextIndex(1));
            }
        );

        playButton.addEventListener(
            "click",
            () => {
                const game =
                    games.find(item =>
                        item.name ===
                        slides[currentSlide].title
                    );

                if (game) {
                    openGame(game);
                }
            }
        );

        browseButton.addEventListener(
            "click",
            () => {
                document.querySelector("#games")
                    .scrollIntoView({
                        behavior: reducedMotion
                            ? "auto"
                            : "smooth"
                    });
            }
        );

        backButton.addEventListener(
            "click",
            () => {
                if (
                    gameFramePage.classList.contains(
                        "active"
                    )
                ) {
                    returnHome();
                } else {
                    window.history.back();
                }
            }
        );

        frameBackButton.addEventListener(
            "click",
            returnHome
        );

        banner.addEventListener(
            "mouseenter",
            () => {
                if (!isPaused) {
                    clearTimeout(switchTimer);
                }
            }
        );

        banner.addEventListener(
            "mouseleave",
            () => {
                if (!isPaused) {
                    scheduleNextSlide();
                }
            }
        );

        document.addEventListener(
            "keydown",
            event => {
                if (
                    gameFramePage.classList.contains(
                        "active"
                    )
                ) {
                    if (event.key === "Escape") {
                        returnHome();
                    }

                    return;
                }

                const activeElement =
                    document.activeElement;

                const isTyping =
                    activeElement &&
                    (
                        activeElement.tagName ===
                            "INPUT" ||
                        activeElement.tagName ===
                            "TEXTAREA"
                    );

                if (isTyping) {
                    return;
                }

                if (event.key === "ArrowLeft") {
                    showSlide(getNextIndex(-1));
                }

                if (event.key === "ArrowRight") {
                    showSlide(getNextIndex(1));
                }

                if (event.key === " ") {
                    event.preventDefault();
                    togglePause();
                }
            }
        );

        videos.forEach(video => {
            video.addEventListener(
                "error",
                () => {
                    video.classList.remove(
                        "active"
                    );

                    if (
                        video ===
                        videos[activeVideo]
                    ) {
                        const nextSlide =
                            getNextIndex(1);

                        setTimeout(() => {
                            if (slides.length > 1) {
                                showSlide(
                                    nextSlide
                                );
                            }
                        }, 1000);
                    }
                }
            );
        });

        createDots();
        createGameCards();
        startSlideshow();
    </script>
</body>
</html>
